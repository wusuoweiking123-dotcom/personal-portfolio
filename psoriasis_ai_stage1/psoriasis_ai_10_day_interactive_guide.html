<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>银屑病 AI 研究 10 天交互式说明书</title>
  <style>
    :root {
      --ink: #18212f;
      --muted: #5d6878;
      --line: #d9e0ea;
      --panel: #ffffff;
      --soft: #f5f7fa;
      --teal: #0f766e;
      --blue: #1d4ed8;
      --amber: #b45309;
      --rose: #be123c;
      --green: #166534;
      --shadow: 0 12px 32px rgba(24, 33, 47, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #eef2f6;
      line-height: 1.45;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      background: #172033;
      color: #f8fafc;
      padding: 22px 16px;
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #e0f2fe;
      color: #075985;
      font-weight: 800;
    }

    .brand h1 {
      font-size: 16px;
      line-height: 1.2;
      margin: 0;
      letter-spacing: 0;
    }

    .progress-shell {
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      height: 10px;
      margin: 10px 0 6px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.2s ease;
    }

    .progress-label {
      color: #cbd5e1;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .day-list {
      display: grid;
      gap: 8px;
    }

    .day-btn {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #f8fafc;
      text-align: left;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .day-btn strong {
      display: block;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .day-btn span {
      color: #cbd5e1;
      font-size: 12px;
    }

    .day-btn.active {
      background: #f8fafc;
      color: #111827;
      border-color: #f8fafc;
    }

    .day-btn.active span { color: #475569; }

    main {
      min-width: 0;
      padding: 24px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    .title-block h2 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: 0;
    }

    .title-block p {
      margin: 0;
      color: var(--muted);
      max-width: 920px;
    }

    .utility {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button, .open-link {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    button.primary {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    button.warn {
      color: #7f1d1d;
      border-color: #fecaca;
      background: #fff7f7;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(360px, 0.9fr);
      gap: 18px;
      align-items: start;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      overflow: hidden;
    }

    .section-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-head h3 {
      margin: 0;
      font-size: 15px;
    }

    .section-body {
      padding: 16px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #fff;
    }

    .pill.core { color: #065f46; border-color: #a7f3d0; background: #ecfdf5; }
    .pill.high { color: #92400e; border-color: #fde68a; background: #fffbeb; }
    .pill.medium { color: #334155; border-color: #cbd5e1; background: #f8fafc; }

    .checklist {
      display: grid;
      gap: 9px;
    }

    .check-item {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 9px 0;
      border-bottom: 1px solid #edf1f6;
    }

    .check-item:last-child { border-bottom: 0; }

    .check-item input {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: var(--teal);
    }

    .check-item label {
      cursor: pointer;
    }

    .output-box {
      width: 100%;
      min-height: 145px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      resize: vertical;
      font: 13px/1.5 Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #fff;
    }

    .paper-grid {
      display: grid;
      gap: 12px;
    }

    .paper {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }

    .paper-top {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .paper h4 {
      font-size: 14px;
      margin: 0 0 6px;
      line-height: 1.35;
    }

    .paper p {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 10px;
    }

    .paper-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .read-link {
      display: inline-flex;
      align-items: center;
      border-radius: 8px;
      padding: 8px 10px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      font-size: 13px;
      text-decoration: none;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      border-radius: 8px;
      padding: 8px 10px;
      background: #f8fafc;
      color: #334155;
      border: 1px solid var(--line);
      font-size: 13px;
      text-decoration: none;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 10px;
    }

    input[type="search"], select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 13px;
      color: var(--ink);
      background: #fff;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .mini-table th, .mini-table td {
      border-bottom: 1px solid #edf1f6;
      text-align: left;
      padding: 9px 8px;
      vertical-align: top;
    }

    .mini-table th {
      color: #334155;
      background: #f8fafc;
    }

    .callout {
      border-left: 4px solid var(--teal);
      background: #f0fdfa;
      padding: 12px;
      border-radius: 6px;
      color: #134e4a;
      margin-bottom: 12px;
    }

    .warning {
      border-left-color: var(--amber);
      background: #fffbeb;
      color: #78350f;
    }

    .copy-status {
      color: var(--green);
      font-size: 12px;
      min-height: 16px;
    }

    @media (max-width: 1050px) {
      .app { grid-template-columns: 1fr; }
      aside {
        position: static;
        height: auto;
      }
      .day-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .layout {
        grid-template-columns: 1fr;
      }
      .topbar {
        grid-template-columns: 1fr;
      }
      .utility {
        justify-content: flex-start;
      }
    }

    @media (max-width: 680px) {
      main { padding: 14px; }
      .day-list { grid-template-columns: 1fr; }
      .search-row { grid-template-columns: 1fr; }
      .title-block h2 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="mark">PS</div>
        <h1>银屑病 AI 研究<br>10 天说明书</h1>
      </div>
      <div class="progress-shell"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0 已完成</div>
      <div class="day-list" id="dayList"></div>
    </aside>

    <main>
      <div class="topbar">
        <div class="title-block">
          <h2 id="dayTitle"></h2>
          <p id="dayGoal"></p>
        </div>
        <div class="utility">
          <a class="open-link" href="../outputs/psoriasis_ai_stage1/psoriasis_ai_literature_matrix_stage1.xlsx">打开文献矩阵</a>
          <button id="exportBtn">导出进度</button>
          <button id="resetBtn" class="warn">清空勾选</button>
        </div>
      </div>

      <div class="layout">
        <div>
          <section class="section">
            <div class="section-head">
              <h3>今日阅读顺序</h3>
              <span class="pill" id="dayTime"></span>
            </div>
            <div class="section-body">
              <div id="readingOrder"></div>
            </div>
          </section>

          <section class="section">
            <div class="section-head">
              <h3>今日任务清单</h3>
              <span class="pill" id="taskCount"></span>
            </div>
            <div class="section-body">
              <div class="checklist" id="taskList"></div>
            </div>
          </section>

          <section class="section">
            <div class="section-head">
              <h3>今日产出模板</h3>
              <button id="copyTemplateBtn">复制模板</button>
            </div>
            <div class="section-body">
              <textarea class="output-box" id="templateBox"></textarea>
              <div class="copy-status" id="copyStatus"></div>
            </div>
          </section>
        </div>

        <div>
          <section class="section">
            <div class="section-head">
              <h3>今日必读资料</h3>
              <span class="pill core" id="paperCount"></span>
            </div>
            <div class="section-body">
              <div class="paper-grid" id="dailyPapers"></div>
            </div>
          </section>

          <section class="section">
            <div class="section-head">
              <h3>全文献库</h3>
              <span class="pill">39 篇</span>
            </div>
            <div class="section-body">
              <div class="search-row">
                <input id="paperSearch" type="search" placeholder="搜索标题、作者、类别、关键词" />
                <select id="paperFilter">
                  <option value="all">全部类别</option>
                  <option value="Review">Review</option>
                  <option value="Severity">Severity/PASI</option>
                  <option value="Diagnosis">Diagnosis</option>
                  <option value="Treatment">Treatment</option>
                  <option value="PsA">PsA/Comorbidity</option>
                  <option value="Progression">Progression/LSCI</option>
                </select>
              </div>
              <div class="paper-grid" id="libraryPapers" style="margin-top:12px;"></div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script>
    const sources = {
      niams: "https://www.niams.nih.gov/health-topics/psoriasis",
      aad: "https://www.aad.org/member/clinical-quality/guidelines/psoriasis",
      nice: "https://www.nice.org.uk/guidance/cg153/ifp/chapter/phototherapy",
      scin: "https://github.com/google-research-datasets/scin",
      fitz: "https://github.com/mattgroh/fitzpatrick17k",
      ddi: "https://ddi-dataset.github.io/",
      dermnet: "https://dermnetnz.org/topics/dermnet-skin-disease-atlas-dataset",
      chizariFigshare: "https://doi.org/10.6084/m9.figshare.14995083"
    };

    const papers = [
      {id:1, day:2, category:"Review", priority:"Core", year:2024, author:"Barlow", title:"AI in Psoriatic Disease: Scoping Review", journal:"JMIR Dermatology", url:"https://pubmed.ncbi.nlm.nih.gov/39413371/", why:"先读它。它告诉你 AI 在银屑病疾病谱中已经做过诊断、严重度、治疗反应和临床结局预测。"},
      {id:2, day:2, category:"Review", priority:"Core", year:2023, author:"Liu", title:"Artificial intelligence in psoriasis: Where we are and where we are going", journal:"Experimental Dermatology", url:"https://pubmed.ncbi.nlm.nih.gov/37740587/", why:"用来建立论文分类框架：诊断、分割、严重度、治疗和管理。"},
      {id:3, day:4, category:"Review", priority:"Core", year:2024, author:"Li", title:"A review of psoriasis image analysis based on machine learning", journal:"Frontiers in Medicine", url:"https://pubmed.ncbi.nlm.nih.gov/39170035/", why:"直接支持你的 gap：现有图像 AI 多数是定位、识别、面积/严重度评分。"},
      {id:4, day:4, category:"Review", priority:"Core", year:2025, author:"McMullen", title:"Predicting psoriasis severity using machine learning: a systematic review", journal:"Clinical and Experimental Dermatology", url:"https://pubmed.ncbi.nlm.nih.gov/39172548/", why:"证明 severity/PASI 是已有热点，所以你的题目要避开泛泛严重度评估。"},
      {id:5, day:4, category:"Review", priority:"High", year:2024, author:"Goessinger", title:"Image-Based Artificial Intelligence in Psoriasis Assessment: The Beginning of a New Diagnostic Era?", journal:"American Journal of Clinical Dermatology", url:"https://pubmed.ncbi.nlm.nih.gov/39259262/", why:"帮助你理解图像标准化、商业系统和临床转化。"},
      {id:6, day:4, category:"Review", priority:"High", year:2024, author:"McMullen", title:"Machine Learning Applications in Psoriasis Treatment: A Systematic Review", journal:"Journal of Cutaneous Medicine and Surgery", url:"https://pubmed.ncbi.nlm.nih.gov/38450601/", why:"支撑治疗调整和个体化治疗这个价值点。"},
      {id:7, day:4, category:"Review", priority:"High", year:2023, author:"Lunge", title:"Therapeutic application of machine learning in psoriasis: A PRISMA systematic review", journal:"Journal of Cosmetic Dermatology", url:"https://pubmed.ncbi.nlm.nih.gov/35621249/", why:"补充治疗相关 ML 的综述证据。"},
      {id:8, day:4, category:"Review", priority:"Medium", year:2020, author:"Yu", title:"Machine Learning Applications in the Evaluation and Management of Psoriasis: A Systematic Review", journal:"Journal of Psoriasis and Psoriatic Arthritis", url:"https://pubmed.ncbi.nlm.nih.gov/33733038/", why:"早期系统综述，可作为领域发展背景。"},
      {id:9, day:4, category:"Review", priority:"Medium", year:2025, author:"Cai", title:"Assessing the performance of artificial intelligence models in evaluating inflammatory skin disease severity", journal:"British Journal of Dermatology", url:"https://pubmed.ncbi.nlm.nih.gov/40570030/", why:"把银屑病放进 inflammatory skin disease severity AI 的大趋势。"},
      {id:10, day:4, category:"Review", priority:"Medium", year:2024, author:"Smith", title:"Advancing Psoriasis Care through Artificial Intelligence: A Comprehensive Review", journal:"Current Dermatology Reports", url:"https://pubmed.ncbi.nlm.nih.gov/39301276/", why:"作为补充综述，不作为主轴。"},
      {id:11, day:6, category:"Severity/PASI", priority:"Core", year:2023, author:"Huang", title:"Artificial Intelligence-Based Psoriasis Severity Assessment: Real-world Study and Application", journal:"JMIR", url:"https://pubmed.ncbi.nlm.nih.gov/36927843/", why:"SkinTeller 代表性工作，14,096 张图像、2,367 名患者，是严重度 AI 的核心案例。"},
      {id:12, day:6, category:"Severity/PASI", priority:"Core", year:2022, author:"Okamoto", title:"Artificial intelligence for the automated single-shot assessment of psoriasis severity", journal:"JEADV", url:"https://pubmed.ncbi.nlm.nih.gov/35739649/", why:"展示单张/少量照片估计 PASI 的思路。"},
      {id:13, day:5, category:"Segmentation/Area", priority:"Core", year:2020, author:"Meienberger", title:"Observer-independent assessment of psoriasis-affected area using machine learning", journal:"JEADV", url:"https://pubmed.ncbi.nlm.nih.gov/31594034/", why:"面积评估是未来扩展预测的基础。"},
      {id:14, day:6, category:"Severity/PASI", priority:"High", year:2024, author:"Maulana", title:"Psoriasis severity assessment: Optimizing diagnostic models with deep learning", journal:"Narra Journal", url:"https://pubmed.ncbi.nlm.nih.gov/39816098/", why:"标准深度学习严重度分类案例。"},
      {id:15, day:6, category:"Severity/PASI", priority:"Medium", year:2022, author:"Amruthalingam", title:"Quantification of Efflorescences in Pustular Psoriasis Using Deep Learning", journal:"Healthcare Informatics Research", url:"https://pubmed.ncbi.nlm.nih.gov/35982596/", why:"说明 AI 可以量化具体皮损元素。"},
      {id:16, day:6, category:"Imaging Biomarkers", priority:"Core", year:2024, author:"He", title:"Machine Learning Analysis of Human Skin by Optoacoustic Mesoscopy for Automated Extraction of Psoriasis and Aging Biomarkers", journal:"IEEE TMI", url:"https://pubmed.ncbi.nlm.nih.gov/38241120/", why:"和 LSCI 一样属于影像生物标志物路线，方法价值很高。"},
      {id:17, day:6, category:"Severity/PASI", priority:"Medium", year:2025, author:"Yang", title:"Development and Validation of an AI-Driven Model for Erythrodermic Psoriasis Severity", journal:"American Journal of Clinical Dermatology", url:"https://pubmed.ncbi.nlm.nih.gov/40856906/", why:"非图像临床/实验室 ML 严重度分层案例。"},
      {id:18, day:5, category:"Diagnosis", priority:"High", year:2022, author:"Yu", title:"Differentiating scalp psoriasis and seborrheic dermatitis from dermoscopic images", journal:"Frontiers in Medicine", url:"https://pubmed.ncbi.nlm.nih.gov/36405606/", why:"诊断类论文里比较适合精读，任务定义清楚，还和医生表现比较。"},
      {id:19, day:5, category:"Diagnosis", priority:"Medium", year:2023, author:"Hammad", title:"Enhanced Deep Learning Approach for Accurate Eczema and Psoriasis Skin Detection", journal:"Sensors", url:"https://pubmed.ncbi.nlm.nih.gov/37631831/", why:"作为移动应用/多病种检测案例，也要注意数据和泛化问题。"},
      {id:20, day:5, category:"Diagnosis", priority:"Medium", year:2024, author:"Eskandari", title:"Efficient diagnosis of psoriasis and lichen planus using deep learning", journal:"Scientific Reports", url:"https://pubmed.ncbi.nlm.nih.gov/38678100/", why:"相似皮肤病鉴别诊断案例。"},
      {id:21, day:5, category:"Diagnosis", priority:"Medium", year:2024, author:"Chakraborty", title:"CAD-PsorNet: deep transfer learning for computer-assisted diagnosis of skin psoriasis", journal:"Scientific Reports", url:"https://pubmed.ncbi.nlm.nih.gov/39489752/", why:"典型 transfer learning pipeline，可作为方法背景但不是主线。"},
      {id:22, day:5, category:"Diagnosis", priority:"Medium", year:2022, author:"Aijaz", title:"Deep Learning Application for Classification of Different Types of Psoriasis", journal:"Journal of Healthcare Engineering", url:"https://pubmed.ncbi.nlm.nih.gov/35075392/", why:"银屑病亚型分类案例。"},
      {id:23, day:6, category:"Severity/PASI", priority:"High", year:2023, author:"Folle", title:"DeepNAPSI multi-reader nail psoriasis prediction using deep learning", journal:"Scientific Reports", url:"https://pubmed.ncbi.nlm.nih.gov/37005487/", why:"指甲银屑病评分自动化案例，强调多读者评估。"},
      {id:24, day:6, category:"Severity/PASI", priority:"Medium", year:2024, author:"Horikawa", title:"Reliable and easy-to-use calculating tool for NAPSI using deep learning", journal:"NPJ Systems Biology and Applications", url:"https://pubmed.ncbi.nlm.nih.gov/39511184/", why:"从模型到工具的转化案例。"},
      {id:25, day:6, category:"Severity/PASI", priority:"Medium", year:2024, author:"Paik", title:"Automatic evaluation of Nail Psoriasis Severity Index using deep learning", journal:"Journal of Dermatology", url:"https://pubmed.ncbi.nlm.nih.gov/38847292/", why:"YOLOv7 目标检测式标注/评分案例。"},
      {id:26, day:6, category:"Severity/PASI", priority:"Medium", year:2025, author:"Kemenes", title:"Independent validation of automated mNAPSI scoring using deep learning", journal:"Frontiers in Medicine", url:"https://pubmed.ncbi.nlm.nih.gov/40241894/", why:"强调独立验证，对你以后评估模型很重要。"},
      {id:27, day:7, category:"Treatment", priority:"Core", year:2023, author:"Du", title:"Machine learning model for predicting outcomes of biologic therapy in psoriasis", journal:"JAAD", url:"https://pubmed.ncbi.nlm.nih.gov/36720368/", why:"治疗反应预测代表，说明 AI 在临床决策支持中更容易找到价值。"},
      {id:28, day:7, category:"Treatment", priority:"Core", year:2025, author:"Peng", title:"Machine Learning-Driven Prediction Models for Brodalumab Therapeutic Effect", journal:"Psoriasis (Auckland)", url:"https://pubmed.ncbi.nlm.nih.gov/40873762/", why:"临床和转录组数据结合预测治疗反应。"},

      const keys = allTaskKeys();
      const done = keys.filter(k => state[k]).length;
      const pct = keys.length ? Math.round(done / keys.length * 100) : 0;
      progressBar.style.width = `${pct}%`;
      progressLabel.textContent = `${done} / ${keys.length} 已完成`;
    }

    function renderDayButtons() {
      dayList.innerHTML = days.map(d => `
        <button class="day-btn ${d.day === activeDay ? "active" : ""}" data-day="${d.day}">
          <strong>Day ${d.day}</strong>
          <span>${escapeHtml(d.title.replace(/^Day \\d+：/, ""))}</span>
        </button>
      `).join("");
      dayList.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          activeDay = Number(btn.dataset.day);
          render();
        });
      });
    }

    function renderOrder(items) {
      return `
        <table class="mini-table">
          <thead><tr><th style="width:38%">阅读入口</th><th>精读目标</th></tr></thead>
          <tbody>
            ${items.map(item => `
              <tr>
                <td><a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.label)}</a></td>
                <td>${escapeHtml(item.note)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderTasks(day) {
      taskList.innerHTML = day.tasks.map((task, i) => {
        const key = taskKey(day.day, i);
        return `
          <div class="check-item">
            <input type="checkbox" id="${key}" ${state[key] ? "checked" : ""} />
            <label for="${key}">${escapeHtml(task)}</label>
          </div>
        `;
      }).join("");
      taskList.querySelectorAll("input").forEach(input => {
        input.addEventListener("change", () => {
          state[input.id] = input.checked;
          saveState();
          renderTaskCount(day);
        });
      });
    }

    function renderTaskCount(day) {
      const done = day.tasks.filter((_, i) => state[taskKey(day.day, i)]).length;
      taskCount.textContent = `${done}/${day.tasks.length}`;
    }

    function paperCard(paper) {
      return `
        <article class="paper">
          <div class="paper-top">
            <span class="pill ${priorityClass(paper.priority)}">${paper.priority}</span>
            <span class="pill">${escapeHtml(paper.category)}</span>
            <span class="pill">${paper.year}</span>
          </div>
          <h4>${paper.id}. ${escapeHtml(paper.author)}：${escapeHtml(paper.title)}</h4>
          <p>${escapeHtml(paper.journal)}。${escapeHtml(paper.why)}</p>
          <div class="paper-actions">
            <a class="read-link" href="${paper.url}" target="_blank" rel="noopener">阅读 PubMed/DOI</a>
            <button data-copy="${paper.id}">复制引用信息</button>
          </div>
        </article>
      `;
    }

    function renderDailyPapers(day) {
      const dayPapers = papers.filter(p => p.day === day.day);
      paperCount.textContent = `${dayPapers.length} 项`;
      dailyPapers.innerHTML = dayPapers.length
        ? dayPapers.map(paperCard).join("")
        : `<div class="callout">今天主要整理输出，不新增论文精读。</div>`;
    }

    function renderLibrary() {
      const query = paperSearch.value.trim().toLowerCase();
      const filter = paperFilter.value;
      const filtered = papers.filter(p => {
        const hay = `${p.category} ${p.priority} ${p.year} ${p.author} ${p.title} ${p.journal} ${p.why}`.toLowerCase();
        const matchQuery = !query || hay.includes(query);
        const matchFilter = filter === "all" || p.category.includes(filter);
        return matchQuery && matchFilter;
      });
      libraryPapers.innerHTML = filtered.slice(0, 12).map(paperCard).join("") || `<div class="callout warning">没有匹配结果。</div>`;
      libraryPapers.querySelectorAll("button[data-copy]").forEach(btn => {
        btn.addEventListener("click", () => copyPaper(Number(btn.dataset.copy)));
      });
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.focus();
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    async function copyPaper(id) {
      const p = papers.find(item => item.id === id);
      const text = `${p.author} (${p.year}). ${p.title}. ${p.journal}. ${p.url}`;
      await copyText(text);
    }

    function bindPaperCopyButtons() {
      document.querySelectorAll("button[data-copy]").forEach(btn => {
        btn.addEventListener("click", () => copyPaper(Number(btn.dataset.copy)));
      });
    }

    function render() {
      const day = days.find(d => d.day === activeDay);
      dayTitle.textContent = day.title;
      dayGoal.textContent = day.goal;
      dayTime.textContent = day.time;
      readingOrder.innerHTML = renderOrder(day.order);
      templateBox.value = day.template;
      renderDayButtons();
      renderTasks(day);
      renderTaskCount(day);
      renderDailyPapers(day);
      renderLibrary();
      bindPaperCopyButtons();
      renderProgress();
    }

    document.getElementById("copyTemplateBtn").addEventListener("click", async () => {
      await copyText(templateBox.value);
      const copyStatus = document.getElementById("copyStatus");
      copyStatus.textContent = "已复制";
      setTimeout(() => copyStatus.textContent = "", 1200);
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const done = allTaskKeys().filter(k => state[k]);
      const lines = days.map(d => {
        const count = d.tasks.filter((_, i) => state[taskKey(d.day, i)]).length;
        return `Day ${d.day}: ${count}/${d.tasks.length} - ${d.title}`;
      });
      const blob = new Blob([`银屑病 AI 研究 10 天进度\\n\\n${lines.join("\\n")}\\n\\n已完成任务键：\\n${done.join("\\n")}`], {type:"text/plain"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "psoriasis_ai_10_day_progress.txt";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("确认清空所有勾选进度？")) return;
      state = {};
      saveState();
      render();
    });

    paperSearch.addEventListener("input", renderLibrary);
    paperFilter.addEventListener("change", renderLibrary);

    render();
  </script>
</body>
</html>
