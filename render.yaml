services:
  - type: web
    name: personal-portfolio-agent
    env: python
    rootDir: personal-rag-agent
    buildCommand: ""
    startCommand: "python app.py"
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_READ_ONLY
        value: "true"
      - key: OPENAI_BASE_URL
        value: https://api.moonshot.cn/v1
      - key: OPENAI_MODEL
        value: moonshot-v1-8k
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
